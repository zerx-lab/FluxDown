[package]
name = "fluxdown_agent"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "fluxdown-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"], optional = true }
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
blake3 = { version = "1.8.7", optional = true }
directories = "6"
ed25519-dalek = "3"
flate2 = "1"
fluxdown_api = { version = "0.1.0", path = "../api" }
fluxdown_link = { version = "0.1.0", path = "../link" }
fluxdown_logfile = { version = "0.1.0", path = "../logfile" }
fluxdown_protocol = { path = "../protocol" }
fluxdown_ui_i18n = { version = "0.1.0", path = "../../crates/i18n", optional = true }
fs2 = "0.4.3"
futures-util = "0.3.32"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"], optional = true }
mimalloc = "0.1.52"
regex = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6.5"
tao = { version = "0.37", default-features = false, optional = true }
tar = "0.4"
thiserror = "2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util", "fs", "time", "process"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7.18", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"], optional = true }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# 阻止系统休眠仅在桌面三平台存在（keepawake 不支持 Android / iOS）。
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
keepawake = "0.6"

# TLS 后端按平台区分（对齐 engine）：Windows 用系统 Schannel（reqwest 默认 native-tls）；
# 其余平台用 rustls，native roots 保留本地 CA，bundled WebPKI roots 作公共 CA 兜底——
# NAS / 精简发行版的系统根证书缺失时 FluxCloud HTTPS 也不会全部 UnknownIssuer。
# `socks`：统一出口（`egress.rs`）可能给出用户配置的 SOCKS 代理；tokio-socks 已随 engine 在依赖树中。
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "macos-system-configuration", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "socks"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
# ShellExecuteW("open")：open/reveal 回退的标准「打开」调用（见 platform/mod.rs）
# Win32_UI_Shell_Common：SHParseDisplayName / SHOpenFolderAndSelectItems（ITEMIDLIST 类型，见 platform/mod.rs）
# Win32_UI_Controls / Win32_Graphics_Gdi / Win32_Storage_FileSystem：系统文件图标提取
# （SHGetFileInfoW / IImageList::GetIcon / GetDIBits，见 platform/file_icon.rs）
# 固定 0.59：0.61 引入 windows-link(raw-dylib)，与 cdylib 构建在 CI 上不兼容
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# 应用图标（platform/app_icon/windows.rs）：Win32_System_Com / Win32_Storage_FileSystem = 类型化 IShellLinkW / IPersistFile；
# Win32_System_Threading = OpenProcess / QueryFullProcessImageNameW；Win32_UI_HiDpi = GetDpiForWindow。
# 程序本体图标（platform/app_icon/exe_icon.rs）：Win32_System_LibraryLoader = Begin/Update/EndUpdateResourceW；
# Win32_Storage_FileSystem = MoveFileExW。
windows = { version = "0.61.3", features = ["Data_Xml_Dom", "Foundation", "Media_Core", "Media_Playback", "UI_Notifications", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# notify-rust 仅用于 Linux D-Bus 通知（macOS / Windows 用原生通知；Android / iOS 不编译）。
# x11rb（X11 XGrabKey + XInput2 原始键盘事件）与 ashpd（Wayland GlobalShortcuts portal）
# 承载全局快捷键（见 platform/hotkey），随 `desktop` 启用。ashpd 必须与 GPUI（gpui_linux / gpui-base）
# 同用 `async-io`：发布流水线把 agent 与桌面端放在同一次 cargo 构建里，特性合并后 ashpd 不允许
# `tokio` 与 `async-io` 同开（compile_error）。
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"], optional = true }
gtk = { version = "0.18", optional = true }
notify-rust = "4.11"
x11rb = { version = "0.13.2", features = ["xinput"], optional = true }

# 系统文件图标（NSWorkspace → NSBitmapImageRep → PNG，见 platform/file_icon.rs），随 `desktop` 启用。
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "NSEvent", "block2"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry", "NSBundle", "NSArray", "NSSet", "NSError", "NSObject"], optional = true }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger"], optional = true }

[features]
# 桌面外壳集成：托盘（tao 事件循环 + tray-icon）、剪贴板监听、全局快捷键、托盘文案 i18n。
# 官方桌面包（desktop-dev / GPUI 打包流水线）开启；headless 构建关闭，此时关闭全部 UI
# 后后台恒驻留。Linux 开启后运行期需要 GTK3 与 (ayatana-)appindicator。
desktop = [
    "dep:tao",
    "dep:tray-icon",
    "dep:image",
    "dep:blake3",
    "dep:arboard",
    "dep:fluxdown_ui_i18n",
    "dep:gtk",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:block2",
    "dep:objc2-user-notifications",
    "dep:x11rb",
    "dep:ashpd",
]

# server 模式的 Web UI：构建期把 `FLUXDOWN_EMBED_WEBROOT`（缺省 `web/dist`）内嵌进二进制，
# 见 build.rs / src/web_assets.rs。未启用时 `--server` 仍可用 `FLUXDOWN_WEBROOT` 磁盘托管，
# 否则对前端请求回 503 提示页。
web-ui = []
