[package]
name = "fluxdown_engine"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
aes = "0.8"
# librqbit 的 TorrentStorage trait 以 anyhow::Result 为方法签名，实现方必须直接依赖（bt_partfile）。
anyhow = "1.0.104"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "deflate", "zstd"] }
async-trait = "0.1.87"
base64 = "0.22"
bytes = "1"
cbc = "0.1"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }
dash-mpd = { version = "0.19", default-features = false }
# 系统标准用户目录（下载目录 = Windows FOLDERID_Downloads / XDG user-dirs），
# 禁止 $HOME 拼接。与 native/cli 同版本。
directories = "6.0.0"
encoding_rs = "0.8"
feed-rs = "2.4"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
m3u8-rs = "6"
md-5 = "0.10"
# eD2K 端口映射：rqbit fork 的 PortMapper（版本由根 [patch.crates-io] 钉到与 librqbit 同一 rev）。
librqbit-upnp = { version = "9", default-features = false, optional = true }
md4 = { version = "0.10", optional = true }
rand = "0.9"
# 与 feed-rs 同版本：feed 扩展命名空间（Mikan `<torrent><pubDate>`）的二次扫描。
quick-xml = { version = "0.41", features = ["encoding"] }
regex = "1"
# 全平台 rustls（Windows 同样不用 native-tls / schannel：其 ClientHello 缺 status_request 与 ALPN，
# 部分 Cloudflare WAF 直接 403，#1072）。代码侧另经 `downloader::client_builder` 显式选 rustls，
# 防 Windows 桌面构建里 agent 打开的 reqwest 默认 native-tls 经 feature 合并抢回默认后端。
# native roots 保留系统 CA（Windows 证书库 / Linux / macOS）；bundled WebPKI roots 为 Android/iOS
# 提供公共 CA 兜底，避免系统证书探测返回空库时所有 HTTPS 请求 UnknownIssuer。
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "cookies", "json", "socks", "charset", "http2", "system-proxy", "macos-system-configuration"] }
# 与 gpui-shell 同一 Longbridge `quickjs-jit` 分叉（rquickjs API；以 `rquickjs` 名引用）。禁止叠加
# `rust-alloc` / `allocator`（`set_memory_limit` 会静默失效）；`parallel` 必带（Async* 的 Send/Sync）。
rquickjs = { package = "quickjs-jit", version = "0.14.1", features = ["full-async", "parallel"], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["derive", "runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres", "any"] }
suppaftp = { version = "6", default-features = false }
thiserror = "2.0"
tokio = { version = "1.45.0", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }
# 插件 zip 安装（跨桌面/服务端；仅 plugins feature 开启时启用）
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
fs2 = "0.4.3"
fluxdown_logfile = { version = "0.1.0", path = "../logfile" }
psl = "2.1.245"
ed25519-dalek = { version = "3", default-features = false, features = ["fast"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }

[target."cfg(windows)".dependencies]
librqbit = { version = "9", default-features = false, features = ["default-tls"], optional = true }
# 固定 0.59：0.61 引入 windows-link(raw-dylib)，与 cdylib 构建在 CI 上不兼容
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
winreg = "0.55"

[target."cfg(not(windows))".dependencies]
# 固定 0.2.189（全工作区经此统一）：放开前跑 CI `ios-core`（或 cargo check -p fluxdown_mobile --target aarch64-apple-ios）。
libc = "=0.2.189"
librqbit = { version = "9", default-features = false, features = ["rust-tls"], optional = true }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
if-addrs = "0.15"

[dev-dependencies]
http = "1.4.0"
ts2mp4 = "0.3"

[features]
# 默认关闭；desktop/server 构建显式开启，mobile（Android/iOS）保持关闭以免背 JS 引擎债。
plugins = ["dep:rquickjs", "dep:zip", "dep:ed25519-dalek", "dep:image"]
# 组件托管安装（ffmpeg 下载/解压）；desktop/server 开启，mobile/CLI 关闭。
components = ["dep:zip"]
# P2P 能力（BitTorrent / eD2K）。默认开启；App Store 的 iOS 商店构建通过
# `--no-default-features` 在**编译期**整体剔除（不链接 librqbit，也不残留休眠的 P2P 代码）。
# 关闭后 magnet / .torrent / ed2k 任务一律被明确拒绝（见 `download_manager::UNSUPPORTED_PROTOCOL_MESSAGE`），
# 其余协议行为不变。
default = ["bt", "ed2k"]
# BitTorrent：librqbit 会话、做种、tracker 订阅、种子元数据探测。
bt = ["dep:librqbit"]
# eD2K / Kad：协议栈、服务器订阅、端口映射（UPnP / NAT-PMP / PCP，与 BT 共用 rqbit fork 的 PortMapper）。
ed2k = ["dep:librqbit-upnp", "dep:md4"]

# 仅依赖 P2P 模块的探针 / 端到端示例：对应 feature 关闭时不参与构建。
[[example]]
name = "ed2k_e2e"
required-features = ["ed2k"]

[[example]]
name = "kad_probe"
required-features = ["ed2k"]

[[example]]
name = "peer_probe"
required-features = ["ed2k"]

[[example]]
name = "prod_download"
required-features = ["ed2k"]
