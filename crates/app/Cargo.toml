[package]
name = "fluxdown_ui_app"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "fluxdown-desktop"
path = "src/main.rs"

# Windows 便携版的 flux_down.exe：旧 Flutter 更新器固定重启该名，转交 fluxdown-desktop。
[[bin]]
name = "flux_down"
path = "src/legacy_launcher.rs"

[lints]
workspace = true

[dependencies]
directories = "6"
fluxdown_protocol = { version = "0.1.0", path = "../../native/protocol" }
fluxdown_ui_command_palette = { version = "0.1.0", path = "../command_palette" }
fluxdown_ui_account = { version = "0.1.0", path = "../account" }
fluxdown_ui_downloads = { path = "../downloads" }
fluxdown_ui_extensions = { version = "0.1.0", path = "../extensions" }
fluxdown_ui_i18n = { path = "../i18n" }
fluxdown_ui_icon_pack = { path = "../icon_pack" }
fluxdown_ui_rss = { version = "0.1.0", path = "../rss" }
fluxdown_ui_settings = { path = "../settings" }
fluxdown_ui_shell = { path = "../shell" }
fluxdown_ui_theme = { path = "../theme" }
futures-util = "0.3.32"
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui_platform.workspace = true
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "process", "time", "net", "macros", "fs"] }
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
fluxdown_ui_components = { version = "0.1.0", path = "../components" }
mimalloc = "0.1.52"
log = "0.4"
fluxdown_logfile = { version = "0.1.0", path = "../../native/logfile" }
base64 = "0.22"
fluxdown_ui_plugin_ui = { version = "0.1.0", path = "../plugin_ui" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSObject"] }
