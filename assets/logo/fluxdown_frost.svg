    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A1670" flood-opacity=".45"/>
    </filter>
    <path id="arrow" d="M 226 131 Q 226 119 238 119 L 274 119 Q 286 119 286 131 L 286 296 L 331 251 Q 340 242 349 251 L 363 265 Q 372 274 363 283 L 265 381 Q 256 390 247 381 L 149 283 Q 140 274 149 265 L 163 251 Q 172 242 181 251 L 226 296 Z"/>
  </defs>

  <rect x="56" y="56" width="400" height="400" rx="88" fill="url(#bg)"/>
  <rect x="56" y="56" width="400" height="400" rx="88" fill="url(#sheen)"/>
  <use href="#arrow" fill="url(#frost)" filter="url(#shadow)"/>
  <use href="#arrow" fill="none" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round"/>
