<svg width="512" height="512" viewBox="56 56 400 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>FluxDown · Frost</title>
  <desc>Cobalt squircle with a pale, frosted-glass download arrow and a bright rim</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="56" x2="416" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#1B33B8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="256" cy="30" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CC2FF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#9CC2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frost" x1="0" y1="119" x2="0" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E3ECFF"/>
      <stop offset="1" stop-color="#B9CCFF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="119" x2="0" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
