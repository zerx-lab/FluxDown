name: Verify YouTube mini-player badge fix

on:
  push:
    branches:
      - fix/youtube-miniplayer-download-overlap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluxDown
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install extension dependencies
        run: npm ci
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Unit test YouTube mini-player positioning
        run: bun test utils/miniplayer-position.test.ts
      - name: Full extension typecheck
        run: npm run typecheck
      - name: Build Firefox extension
        run: npm run build:firefox
      - name: Build Chrome/Edge extension
        run: npm run build
      - name: Package temporary test builds
        shell: bash
        run: |
          cd .output
          test -f firefox-mv3/manifest.json
          test -f chrome-mv3/manifest.json
          zip -qr ../fluxdown-firefox-miniplayer-fix.zip firefox-mv3
          zip -qr ../fluxdown-chrome-miniplayer-fix.zip chrome-mv3
      - name: Upload browser extension test builds
        uses: actions/upload-artifact@v4
        with:
          name: FluxDown-mini-player-fix-unsigned-preview
          path: |
            fluxDown/fluxdown-firefox-miniplayer-fix.zip
            fluxDown/fluxdown-chrome-miniplayer-fix.zip
          retention-days: 30
          if-no-files-found: error
