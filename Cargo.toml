# This file is used for telling Rust-related tools
# where various Rust crates are.
# This also unifies `target` output folder and
# various Rust configurations.

[workspace]
resolver = "3"
members = ["native/*", "crates/*", "scripts/desktop-dev"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# GPUI 核心 = gpui-fast（Retained Mode + 滚动图层），gpui-kit 组件一律开 `gpui-fast` feature 直接编译到
# gpui-fast 上（gpui-kit 官方支持的配置；其非可选的 `gpui-pre` 依赖仍会编进依赖图但不被使用）。
# 升级时 gpui-kit 各包取同一发布版，gpui-fast 取该版 gpui-kit `Cargo.toml` 锁定的同一版本。
# 渲染读取的状态须在 entity / global / ListState / ScrollHandle 内，改了要 notify 读者；
# 排查界面陈旧时用 `GPUI_VIEW_RETENTION=0`（关复用）/ `GPUI_SCROLL_LAYERS=0`（关滚动图层）对照。
gpui = { package = "gpui-fast", version = "0.1.13" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.13", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-base = { version = "0.9.0", features = ["gpui-fast"] }
gpui-component = { version = "0.9.0", features = ["gpui-fast"] }
gpui-component-assets = { package = "gpui-kit-assets", version = "0.9.0", features = ["gpui-fast"] }
# GPUI Shell（gpui-kit 的 JS 插件 UI 运行时）：与上面的 gpui-kit 组件同一发布版。关 `webview`（会引入 wry），
# 保留 `quickjs` 引擎与 `components` 组件目录。其 QuickJS 走 crates.io `quickjs-jit`（engine 插件运行时同用）。
gpui-shell = { version = "0.9.0", default-features = false, features = ["quickjs", "components", "gpui-fast"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
winresource = "0.1.31"

[workspace.lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
expect_used = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[patch.crates-io]
# zerx-lab/rqbit 分支 fluxdown/peer-policy = 上游 ikatson/rqbit main（v9.0.1 之后，同步至 2026-10-28）+ lingdiansr MSE
# + Android HTTPS 修复（bundled webpki 根替代需 JNI 初始化的 rustls-platform-verifier，否则 Android 上任何
# https tracker 都会 panic 掉磁力解析）+ tracker panic 隔离 + 握手超时下发到 Live 种子的 peer 连接
# + 初检末尾到达的暂停不再丢失（校验完落 Paused 而非转 Live）+ BT 防吸血 PeerPolicy 钩子
# （peer_policy.rs：admit / readmit / 事件 / 限速·Choke·断开）+ 始终发冗余 HAVE + 发送前丢弃已 Cancel 的块。
librqbit = { git = "https://github.com/zerx-lab/rqbit", rev = "958b5feecf365d6edb712fe15ce4084235552f9a" }
# 上游 main 已修、crates.io 0.7.0 未发布：Windows 上 UDP recv_from 因先前 send_to 收到 ICMP
# 端口不可达而报 WSAECONNRESET(10054) 时，0.7.0 的 uTP 分发循环直接退出，整个会话的 uTP 失效。
# 上游发布含该修复的版本后删除本条。
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp", rev = "06e1c53c8df6edb2830d6aab64a6d4bed8479908" }
# 上游 0.7.0 在 iOS 上编译失败（Apple 平台只放行 macOS 的按索引绑定），补丁见源码内 `FluxDown 补丁` 注释；
# 上游修复发布后删除本条与 third_party/ 副本。
librqbit-dualstack-sockets = { path = "third_party/librqbit-dualstack-sockets" }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

# 第三方依赖在 dev 下用 O1（workspace 成员保持 O0 便于调试）：O0 时 fluxdown-desktop 的
# `__eh_frame` 约 21.7MB，超过 macOS ld compact unwind 能编码的 16MB 偏移上限，每次链接都报
# `__eh_frame section too large`；O1 后约 11.4MB，`__text` 也从 94MB 降到 59MB。
# 更具体的 `[profile.dev.package.<name>]`（如下方 librqbit）优先于 "*"。
[profile.dev.package."*"]
opt-level = 1

# BT 数据面（逐字节 RC4、逐消息解析、MSE DH 大数运算）在 opt-level 0 下慢一个数量级：
# 本地 loopback 实测 dev 基线 36.5 CPU·s/GB、吞吐封顶 165 MB/s；仅下面 5 个 crate
# 开 O3 后 4.8 CPU·s/GB、854 MB/s。开发期跑 fluxdownd 下 BT 不再吃满多核。
[profile.dev.package.librqbit]
opt-level = 3

[profile.release]
# 全部 release 产物（GPUI 桌面端、agent、fluxdownd、CLI、原生移动端核心、nmh、
# Docker/NAS 包）共用本 profile，统一按运行期性能优先：opt-level=3 + fat LTO +
# 单 codegen 单元，换取最佳吞吐/延迟，代价是产物体积和编译时间。
# 不再用 "z"：它关闭循环向量化、压低内联阈值，BT 数据面（DH768 2.46 vs 1.60 ms）、
# 哈希/校验、GPUI 布局等热路径都会明显变慢；体积收益对下载器不划算。
opt-level = 3
# Full LTO：跨 crate 内联 + 死代码消除最彻底，同时利于速度与体积
lto = "fat"
# 单一 codegen 单元：给 LLVM 完整优化视野（牺牲并行编译速度）
codegen-units = 1
# 移除全部符号：不影响运行期性能，只减小分发体积
strip = true
# 注意：不设 panic = "abort" —— engine 的 download_manager 依赖 catch_unwind
# 恢复 task panic（见 AGENTS.md），abort 会让 panic 直接终止进程。
