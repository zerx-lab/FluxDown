<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>Plugin resolver conflict acceptance</title>
  <main id="plugins"></main>
  <div id="toasts"></div>
  <output id="result">Running…</output>
  <script type="module">
    import { createElement as h } from 'react'
    import { createRoot } from 'react-dom/client'
    import { translate } from '../src/i18n/catalog'
    import { I18nContext } from '../src/i18n/runtime'
    import { rpc, rpcStore } from '../src/lib/rpc'
    import { PluginsTab } from '../src/pages/settings/sections/extensions/PluginsTab'
    import { ToastHost, TooltipProvider } from '../src/ui'
    import '../src/index.css'

    const panel = document.querySelector('#plugins')
    const toasts = document.querySelector('#toasts')
    const result = document.querySelector('#result')
    const t = (key, params) => translate('en', key, params)
    const title = t('pluginResolverUrlConflictsTitle')
    const guidance = t('pluginResolverUrlConflictsHint')
    const path = '/fixture/scoped'
    const dto = (identity, name, pattern) => ({
      identity, name, version: '1.0.0', description: '', homepage: '', enabled: true,
      devMode: false, disabledReason: 'None', settings: [], settingsValues: {}, permissions: [],
      authSupported: false, subscriptionProviderIds: [], resolverUrls: [pattern],
      loadStatus: 'Loaded', loadError: '', contributions: { views: [], commands: [] }, risk: 'standard',
      consentPending: [], consentPendingHosts: [], networkHosts: [],
    })
    const broad = dto('broad@test', 'Broad fixture', 'https://*/download')
    const scoped = dto('scoped@test', 'Scoped fixture', 'https://例子.test/*/download')
    const pair = {
      pattern: broad.resolverUrls[0], otherIdentity: scoped.identity, otherPattern: scoped.resolverUrls[0],
    }
    const enabledList = [{ ...broad, resolverUrlConflicts: [pair] }, scoped]
    const disabledList = [broad, { ...scoped, enabled: false, disabledReason: 'Manual' }]
    let plugins = [broad]
    const publish = (latest) => {
      plugins = latest
      rpcStore.update((state) => ({ ...state, snapshot: { daemon: { plugins }, session: null } }), true)
    }

    // Offline daemon boundary: supply list replies and publish post-mutation snapshots.
    rpc.daemon.plugin.list = async () => plugins
    rpc.daemon.plugin.installDev = async ({ dirPath }) => {
      if (dirPath !== path) throw new Error(`Unexpected install path: ${dirPath}`)
      publish(enabledList)
      return { identity: scoped.identity, missingComponents: [] }
    }
    rpc.daemon.plugin.setEnabled = async ({ identity, enabled }) => {
      if (identity !== scoped.identity) throw new Error(`Unexpected plugin: ${identity}`)
      publish(enabled ? enabledList : disabledList)
      return { ok: true }
    }
    publish(plugins)

    const visible = (element) => element?.checkVisibility({ visibilityProperty: true, opacityProperty: true })
    const find = (root, selector, text) => [...root.querySelectorAll(selector)]
      .find((element) => element.textContent.trim() === text && visible(element))
    const toggle = (label, checked) => panel.querySelector(
      `[role="switch"][aria-label="${label}"][aria-checked="${checked}"]:not(:disabled)`,
    )
    async function waitFor(description, predicate) {
      const deadline = performance.now() + 5000
      while (performance.now() < deadline) {
        const match = predicate()
        if (match) return match
        await new Promise((resolve) => setTimeout(resolve, 25))
      }
      throw new Error(description)
    }
    const pairText = [
      `${broad.identity}: ${pair.pattern}`, `${scoped.identity}: ${pair.otherPattern}`,
    ]
    const notice = () => [...toasts.querySelectorAll('[role="status"]')].find((element) =>
      visible(element) && [title, guidance, ...pairText].every((text) => element.textContent.includes(text)))
    function assertList() {
      if (!find(panel, 'span', title) || !find(panel, 'p', guidance) ||
          ![...panel.querySelectorAll('li')].some((row) =>
            visible(row) && pairText.every((text) => find(row, 'div', text)))) {
        throw new Error('Conflict list must show both identity/pattern pairs and explain the available choices')
      }
    }

    try {
      const i18n = { locale: 'en', t, languages: [] }
      createRoot(toasts).render(h(I18nContext.Provider, { value: i18n }, h(ToastHost)))
      createRoot(panel).render(h(I18nContext.Provider, { value: i18n }, h(TooltipProvider, null,
        h(PluginsTab, { stale: false, active: false, onGoToComponents: () => {} }),
      )))
      const dev = await waitFor('Development mode switch did not render', () => toggle(t('pluginDevModeSwitch'), false))
      if (find(panel, 'span', title)) throw new Error('One plugin must not show a cross-plugin conflict')
      dev.click()
      const input = await waitFor('Directory input did not render', () => panel.querySelector('#plugin-install-dir'))
      Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(input, path)
      input.dispatchEvent(new Event('input', { bubbles: true }))
      const install = await waitFor('Install button did not become available', () =>
        find(panel, 'button:not(:disabled)', t('pluginInstallDirButton')))
      install.click()
      const installedNotice = await waitFor('Install did not warn with both patterns and guidance', notice)
      assertList()
      installedNotice.querySelector('button').click()
      await waitFor('Install notice did not close', () => !notice())

      const disable = await waitFor('Installed plugin switch did not become available', () => toggle(scoped.name, true))
      disable.click()
      const enable = await waitFor('Disabling the plugin did not clear the conflict list', () =>
        !find(panel, 'span', title) && toggle(scoped.name, false))
      enable.click()
      await waitFor('Enabling did not issue a new conflict warning', notice)
      assertList()
      result.textContent = 'PASS: installation, enable/disable, and conflict list'
      document.documentElement.dataset.roostUi = 'pass'
    } catch (error) {
      result.textContent = `FAIL: ${error.message}`
      throw error
    }
  </script>
</html>
