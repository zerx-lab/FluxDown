<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pending file clear: task edit recovery</title>
</head>
<body>
  <main id="root"></main>
  <output id="result">Running…</output>
  <script type="module">
    import { createElement } from 'react'
    import { createRoot } from 'react-dom/client'
    import '../src/index.css'
    import { I18nContext } from '../src/i18n/runtime'
    import { translate } from '../src/i18n/catalog'
    import { APPLICATION_ERROR_CODE, RpcError, rpc, rpcStore } from '../src/lib/rpc'
    import { RenameDialog } from '../src/pages/downloads/dialogs/TaskEditDialogs'
    import { TaskPropertiesDialog } from '../src/pages/downloads/dialogs/TaskPropertiesDialog'

    const taskId = 'pending-clear'
    const snapshot = {
      taskId, url: 'https://example.test/archive', revision: 'r1', saveDir: '/mnt/原位置',
      fileName: '已完成  📦.tar.gz', proxyUrl: '', segments: 1, headers: {}, cookiesConfigured: false,
      properties: { downloadLimitBps: 0, userAgent: '', authRef: '', category: '', tags: [], scheduledAt: 0 },
      capabilities: { request: true, proxy: true, storage: true, rename: true, segments: true, schedule: true },
    }
    const calls = []
    const task = rpc.daemon.task
    const original = { editInfo: task.editInfo, edit: task.edit, rename: task.rename }
    // Offline daemon fixture at the RPC boundary; both dialogs submit through their production code.
    function rejectEdit(operation, params) {
      calls.push({ operation, ...params })
      throw new RpcError({
        code: APPLICATION_ERROR_CODE, message: 'path edit denied',
        data: { code: 'conflict', retryable: false, reason: 'taskFileClearPending' },
      })
    }
    task.editInfo = async (params) => {
      if (params.taskId !== taskId) throw new Error('Loaded a different task')
      return snapshot
    }
    task.edit = async (params) => rejectEdit('edit', params)
    task.rename = async (params) => rejectEdit('rename', params)
    rpcStore.update((state) => ({
      ...state,
      snapshot: { daemon: { tasks: [snapshot] }, preferences: { values: {} } },
    }), true)

    const t = (key, params) => translate('zh', key, params)
    const i18n = { locale: 'zh', t, languages: [] }
    const root = createRoot(document.getElementById('root'))
    const result = document.getElementById('result')
    const render = (component) => root.render(createElement(I18nContext.Provider, { value: i18n },
      createElement(component, { taskId })))
    const visible = (element) => element instanceof HTMLElement &&
      element.getBoundingClientRect().width > 0 && getComputedStyle(element).visibility === 'visible'
    async function waitFor(find, description) {
      const deadline = performance.now() + 5000
      do {
        const element = find()
        if (visible(element)) return element
        await new Promise(requestAnimationFrame)
      } while (performance.now() < deadline)
      throw new Error(`Missing visible ${description}`)
    }
    async function submit(input, value, buttonLabel) {
      const setValue = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set
      setValue.call(input, value)
      input.dispatchEvent(new Event('input', { bubbles: true }))
      const button = await waitFor(() => [...document.querySelectorAll('[role="dialog"] button')]
        .find((button) => !button.disabled && button.textContent.trim() === buttonLabel), buttonLabel)
      button.click()
      await waitFor(() => [...document.querySelectorAll('[role="dialog"] [role="alert"]')]
        .find((alert) => alert.textContent.includes('请恢复原保存位置并重试「仅删除文件」')), 'cleanup recovery instructions')
    }

    try {
      render(TaskPropertiesDialog)
      const location = await waitFor(() => document.querySelector('#edit-save-dir'), 'save directory field')
      await submit(location, '/mnt/新位置', t('taskEditSave'))
      if (calls.length !== 1 || calls[0].operation !== 'edit' || calls[0].taskId !== taskId ||
        calls[0].saveDir !== '/mnt/新位置' || calls[0].expectedRevision !== 'r1') {
        throw new Error('Unified editor did not submit the changed save directory')
      }

      render(RenameDialog)
      const name = await waitFor(() => document.querySelector('#task-edit-field'), 'rename field')
      await submit(name, '新名字.tar.gz', t('confirm'))
      if (calls.length !== 2 || calls[1].operation !== 'rename' || calls[1].taskId !== taskId ||
        calls[1].fileName !== '新名字.tar.gz') {
        throw new Error('Rename dialog did not submit the changed file name')
      }
      result.textContent = 'Both task editors show how to recover a pending file clear.'
      document.documentElement.dataset.roostUi = 'pass'
    } catch (error) {
      result.textContent = String(error)
      throw error
    } finally {
      root.unmount()
      Object.assign(task, original)
      rpcStore.reset()
    }
  </script>
</body>
</html>
